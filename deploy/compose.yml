# Run from deploy/: docker compose --env-file .env up -d --build
services:
  app:
    build:
      context: ..
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8000"
      DEV_ENDPOINTS: "false"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      DATABASE_URL: sqlite:////data/interviewai.db
      # The app is only reachable through Caddy on the compose network, so its
      # X-Forwarded-* headers are trusted. Without this every visitor appears to
      # come from Caddy's address and the sign-in throttle would be shared.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - interview_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  web:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging
volumes:
  interview_data:
  caddy_data:
  caddy_config:
