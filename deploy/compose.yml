# Run from deploy/: docker compose --env-file .env up -d --build
services:
  app:
    build:
      context: ..
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8000"
      DEV_ENDPOINTS: "false"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      DATABASE_URL: sqlite:////data/interviewai.db
    volumes:
      - interview_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  interview_data:
  caddy_data:
  caddy_config:
